name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:                       # ← 这个 job 名就是必需状态检查的 context
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装核查依赖
        run: python -m pip install --quiet pyyaml

      - name: 仓内一致性核查
        run: python .github/scripts/check_structure.py

      - name: 采集脚本入口可用
        run: python scripts/gh_repo_baseline.py --help

      - name: 退出码契约（缺基线必须返回 2，而不是 0/1）
        run: |
          set +e
          python scripts/gh_repo_baseline.py check octocat/Hello-World --baseline /nonexistent.json
          code=$?
          echo "check 退出码 = $code"
          test "$code" -eq 2
